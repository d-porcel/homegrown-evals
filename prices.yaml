# Model prices, in dollars per million tokens, in the format Inspect's --model-cost-config reads.
# Each model needs all four prices: input, output, input_cache_write and input_cache_read. If its pricing
# page lists no cache prices, use the input price for both. Run pytest after editing to check this file.
# With INSPECT_EVAL_MODEL_COST_CONFIG=prices.yaml in .env, every run records its cost in its log.
# The leaderboard prices every run from this file, so all models are compared at the same prices
# and a corrected price reaches older runs. A model missing here uses its log's cost, or shows none.
#
# Only list models Inspect knows. Inspect stops every run, whatever the model, if this file has one
# it doesn't recognise, such as a local or fine-tuned model. Inspect's way to price those is
# set_model_info() in Python: https://inspect.aisi.org.uk/setting-limits.html
#
# Prices change. These are OpenAI's standard rates for short contexts, checked on 6 October 2026
# at https://developers.openai.com/api/docs/pricing

openai/gpt-6-astra: {input: 10.00, input_cache_read: 1.00, input_cache_write: 12.50, output: 50.00}
openai/gpt-6-sol: {input: 2.00, input_cache_read: 0.20, input_cache_write: 2.50, output: 10.00}
openai/gpt-6-luna: {input: 0.10, input_cache_read: 0.01, input_cache_write: 0.125, output: 0.50}

# no separate cache-write price is listed for these two, so cache writes are priced as input
openai/gpt-5.5: {input: 5.00, input_cache_read: 0.50, input_cache_write: 5.00, output: 30.00}
openai/gpt-5.4-mini: {input: 0.75, input_cache_read: 0.075, input_cache_write: 0.75, output: 4.50}
