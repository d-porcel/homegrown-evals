[project]
name = "homegrown-evals"
version = "0.1.0"
description = "Build a small benchmark of how you work, and pick an AI model for your job on evidence instead of vibes."
readme = "README.md"
requires-python = ">=3.11"
# exact versions: a different Inspect can read the judges' answers differently, so it's part of the benchmark version
dependencies = [
    "inspect-ai==0.3.281",
    "openai==3.19.2",
    "anthropic==1.8.0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyright==1.1.414",
    "ruff==0.16.10",
]

[tool.uv]
# a repo you run from, not a library to install
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle's errors, import order, newer Python syntax, and likely bugs
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
# test files anywhere, like a benchmark's own tests in its folder, but not in the folders that only hold outputs
norecursedirs = [".*", "logs", "site", "__pycache__"]
# benchmarks' test files can share a name, like test_checks.py
addopts = "--import-mode=importlib"
# a deprecation inside Inspect's retry code, not this repo's, which would bury real warnings in the output
filterwarnings = ["ignore:The 'initial' parameter is deprecated:DeprecationWarning"]
