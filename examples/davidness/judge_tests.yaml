# Replies whose grades David already knows, to check the judges before trusting them. Each names a
# case, gives a reply and the grades it should get. The golden answers in cases.yaml are always
# tested too, expecting C for both grades in its rubric, decisions and style.
#
# Every case has at least two flawed replies: one that makes the wrong decision and one that
# breaks the style. Both grades are checked on each, so the tests also catch a judge that lets one
# grade leak into the other.
#
# Run them with: python -m calibration test-judges --benchmark examples/davidness

